services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cripto_e2ee_server
    command:
      - "python"
      - "-m"
      - "uvicorn"
      - "server.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--ssl-keyfile"
      - "/app/certs/key.pem"
      - "--ssl-certfile"
      - "/app/certs/cert.pem"
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app/server
      - ./certs:/app/certs
    healthcheck:
      test: ["CMD", "python", "-c", "import socket, ssl; ctx = ssl.create_default_context(cafile='/app/certs/cert.pem'); s = socket.create_connection(('127.0.0.1', 8000), timeout=3); tls = ctx.wrap_socket(s, server_hostname='localhost'); tls.close()"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - e2ee_net
    restart: unless-stopped

  web-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cripto_e2ee_web_ui
    command: ["python", "-m", "ui.app"]
    environment:
      SERVER_URL: "https://server:8000"
      SSL_CERT_FILE: "/app/certs/cert.pem"
      WEB_UI_HOST: "0.0.0.0"
      WEB_UI_PORT: "8082"
    ports:
      - "8082:8082"
    volumes:
      - ./client:/app/client
      - ./ui:/app/ui
      - ./certs:/app/certs
    depends_on:
      server:
        condition: service_healthy
    networks:
      - e2ee_net
    restart: unless-stopped
  web-ui-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cripto_e2ee_web_ui_2
    command: ["python", "-m", "ui.app"]
    environment:
      SERVER_URL: "https://server:8000"
      SSL_CERT_FILE: "/app/certs/cert.pem"
      WEB_UI_HOST: "0.0.0.0"
      WEB_UI_PORT: "8083"
    ports:
      - "8083:8083"
    volumes:
      - ./client:/app/client
      - ./ui:/app/ui
      - ./certs:/app/certs
    depends_on:
      server:
        condition: service_healthy
    networks:
      - e2ee_net
    restart: unless-stopped

  web-ui-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cripto_e2ee_web_ui_3
    command: ["python", "-m", "ui.app"]
    environment:
      SERVER_URL: "https://server:8000"
      SSL_CERT_FILE: "/app/certs/cert.pem"
      WEB_UI_HOST: "0.0.0.0"
      WEB_UI_PORT: "8084"
    ports:
      - "8084:8084"
    volumes:
      - ./client:/app/client
      - ./ui:/app/ui
      - ./certs:/app/certs
    depends_on:
      server:
        condition: service_healthy
    networks:
      - e2ee_net
    restart: unless-stopped

networks:
  e2ee_net:
    driver: bridge