<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mensajería Segura E2EE</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-alt: #334155;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --ok: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
      --bubble-out: #1d4ed8;
      --bubble-in: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; }

    /* Pantalla de Login */
    #auth-screen {
      margin: auto; width: 92%; max-width: 380px; background: var(--panel);
      padding: 1.75rem; border-radius: 14px; box-shadow: 0 10px 25px rgba(0,0,0,.4);
    }
    #auth-screen h1 { font-size: 1.25rem; margin-bottom: .35rem; }
    #auth-screen p { font-size: .85rem; color: var(--muted); margin-bottom: 1.2rem; }
    .field { margin-bottom: .9rem; }
    .field label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: .3rem; }
    .field input {
      width: 100%; padding: .65rem .8rem; border-radius: 8px; border: 1px solid var(--panel-alt);
      background: var(--bg); color: var(--text); font-size: .95rem;
    }
    .btn-row { display: flex; gap: .6rem; margin-top: 1rem; }
    button {
      cursor: pointer; border: none; border-radius: 8px; padding: .65rem 1rem;
      font-weight: 600; font-size: .9rem; transition: .15s;
    }
    .btn-primary { background: var(--accent); color: #fff; flex: 1; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--panel-alt); color: var(--text); flex: 1; }
    .error-msg { color: var(--danger); font-size: .82rem; margin-top: .75rem; min-height: 1.1rem; }

    /* Layout Principal */
    #chat-screen { display: none; height: 100dvh; width: 100%; max-width: 1100px; margin: 0 auto; }
    .sidebar {
      width: 300px; background: var(--panel); border-right: 1px solid var(--panel-alt);
      display: flex; flex-direction: column;
    }
    .sidebar-header {
      padding: 1rem; border-bottom: 1px solid var(--panel-alt);
      display: flex; justify-content: space-between; align-items: center;
    }
    .user-badge { font-weight: 700; font-size: .95rem; }
    .user-badge span { color: var(--ok); font-size: .75rem; display: block; font-weight: 400; }
    .add-contact { display: flex; gap: .4rem; padding: .75rem; border-bottom: 1px solid var(--panel-alt); }
    .add-contact input {
      flex: 1; padding: .5rem .65rem; border-radius: 8px; border: 1px solid var(--panel-alt);
      background: var(--bg); color: var(--text); font-size: .85rem;
    }
    .contact-list { flex: 1; overflow-y: auto; }
    .contact-item {
      padding: .85rem 1rem; border-bottom: 1px solid rgba(255,255,255,.05);
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    }
    .contact-item:hover, .contact-item.active { background: var(--panel-alt); }
    .pill { font-size: .7rem; padding: .15rem .45rem; border-radius: 999px; font-weight: 600; }
    .pill-ok { background: rgba(16,185,129,.2); color: var(--ok); }
    .pill-warn { background: rgba(245,158,11,.2); color: var(--warn); }

    /* Panel de Conversación */
    .main-chat { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
    .chat-header {
      padding: .85rem 1rem; background: var(--panel); border-bottom: 1px solid var(--panel-alt);
      display: flex; justify-content: space-between; align-items: center; gap: .5rem;
    }
    .back-btn { display: none; background: var(--panel-alt); color: var(--text); padding: .4rem .7rem; }
    .messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .6rem; }
    .msg {
      max-width: 78%; padding: .6rem .85rem; border-radius: 12px; font-size: .92rem; line-height: 1.35;
      word-wrap: break-word;
    }
    .msg.OUT { align-self: flex-end; background: var(--bubble-out); border-bottom-right-radius: 3px; }
    .msg.IN { align-self: flex-start; background: var(--bubble-in); border-bottom-left-radius: 3px; }
    .msg-meta { font-size: .68rem; color: rgba(255,255,255,.65); margin-top: .25rem; text-align: right; }
    .composer {
      padding: .75rem; background: var(--panel); border-top: 1px solid var(--panel-alt);
      display: flex; gap: .5rem; align-items: center;
    }
    .composer input[type="text"] {
      flex: 1; padding: .65rem .85rem; border-radius: 999px; border: 1px solid var(--panel-alt);
      background: var(--bg); color: var(--text); font-size: .95rem;
    }
    .empty-hint { margin: auto; color: var(--muted); font-size: .9rem; text-align: center; padding: 1rem; }

    /* Responsive Móvil */
    @media (max-width: 720px) {
      .sidebar { width: 100%; }
      .main-chat { display: none; width: 100%; }
      #chat-screen.in-chat .sidebar { display: none; }
      #chat-screen.in-chat .main-chat { display: flex; }
      .back-btn { display: inline-block; }
    }
  </style>
</head>
<body>

  <!-- 1. Autenticación / Bóveda local -->
  <div id="auth-screen">
    <h1>Chat E2EE (X3DH + Ratchet)</h1>
    <p>Tus claves privadas y bóveda se cifran localmente en este nodo.</p>
    <div class="field">
      <label>Usuario</label>
      <input id="auth-user" type="text" placeholder="ej. alicia" autocomplete="username" />
    </div>
    <div class="field">
      <label>Contraseña maestra de bóveda</label>
      <input id="auth-pass" type="password" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <div class="btn-row">
      <button class="btn-primary" onclick="doAuth('login')">Iniciar sesión</button>
      <button class="btn-secondary" onclick="doAuth('register')">Registrarse</button>
    </div>
    <div id="auth-error" class="error-msg"></div>
  </div>

  <!-- 2. Interfaz Principal -->
  <div id="chat-screen">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="user-badge">
          <span id="me-name">@usuario</span>
          <span>● E2EE activo</span>
        </div>
        <button class="btn-secondary" style="flex:0; padding:.4rem .7rem; font-size:.8rem" onclick="logout()">Salir</button>
      </div>
      <div class="add-contact">
        <input id="new-peer" type="text" placeholder="Agregar usuario..." />
        <button class="btn-primary" style="flex:0; padding:.5rem .8rem" onclick="addContact()">+</button>
      </div>
      <div id="contact-list" class="contact-list"></div>
    </aside>

    <main class="main-chat">
      <div class="chat-header">
        <div style="display:flex; align-items:center; gap:.5rem">
          <button class="back-btn" onclick="closeChatMobile()">←</button>
          <strong id="chat-peer-title">Selecciona un contacto</strong>
          <span id="chat-peer-badge"></span>
        </div>
      </div>

      <div id="messages-box" class="messages">
        <div class="empty-hint">Selecciona o agrega un contacto para iniciar una sesión X3DH.</div>
      </div>

      <form class="composer" onsubmit="sendMessage(event)">
        <input id="msg-input" type="text" placeholder="Escribe un mensaje cifrado..." disabled />
        <button id="send-btn" class="btn-primary" style="flex:0; border-radius:999px" type="submit" disabled>Enviar</button>
      </form>
    </main>
  </div>

  <script>
    let currentUser = null;
    let selectedPeer = null;
    let contactsCache = [];
    let pollTimer = null;

    async function api(url, options = {}) {
      const res = await fetch(url, {
        headers: { "Content-Type": "application/json" },
        ...options
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || "Error en la solicitud");
      return data;
    }

    async function doAuth(action) {
      const errBox = document.getElementById("auth-error");
      errBox.textContent = "";
      const username = document.getElementById("auth-user").value.trim();
      const password = document.getElementById("auth-pass").value;
      try {
        const res = await api("/api/auth", {
          method: "POST",
          body: JSON.stringify({ action, username, password })
        });
        currentUser = res.username;
        document.getElementById("me-name").textContent = `@${currentUser}`;
        document.getElementById("auth-screen").style.display = "none";
        document.getElementById("chat-screen").style.display = "flex";
        await refreshState();
        pollTimer = setInterval(refreshState, 2000);
      } catch (err) {
        errBox.textContent = err.message;
      }
    }

    async function logout() {
      clearInterval(pollTimer);
      await api("/api/logout", { method: "POST" });
      location.reload();
    }

    async function addContact() {
      const input = document.getElementById("new-peer");
      const peer = input.value.trim();
      if (!peer) return;
      try {
        await api("/api/contacts", {
          method: "POST",
          body: JSON.stringify({ peer })
        });
        input.value = "";
        selectPeer(peer);
      } catch (err) {
        alert(err.message);
      }
    }

    function selectPeer(peer) {
      selectedPeer = peer;
      document.getElementById("chat-screen").classList.add("in-chat");
      document.getElementById("msg-input").disabled = false;
      document.getElementById("send-btn").disabled = false;
      refreshState();
    }

    function closeChatMobile() {
      document.getElementById("chat-screen").classList.remove("in-chat");
    }

    async function refreshState() {
      if (!currentUser) return;
      try {
        const query = selectedPeer ? `?peer=${encodeURIComponent(selectedPeer)}` : "";
        const state = await api(`/api/state${query}`);
        contactsCache = state.contacts;
        renderContacts(state.contacts);
        if (selectedPeer) {
          renderChatHeader();
          renderMessages(state.history);
        }
      } catch (_) {}
    }

    function renderContacts(contacts) {
      const list = document.getElementById("contact-list");
      list.innerHTML = contacts.map(c => `
        <div class="contact-item ${c.peer === selectedPeer ? "active" : ""}" onclick="selectPeer('${c.peer}')">
          <span>@${c.peer}</span>
          <span class="pill ${c.verified ? "pill-ok" : "pill-warn"}">
            ${c.verified ? "VERIFICADO" : "NO VERIFICADO"}
          </span>
        </div>
      `).join("");
    }

    function renderChatHeader() {
      const info = contactsCache.find(c => c.peer === selectedPeer);
      document.getElementById("chat-peer-title").textContent = `@${selectedPeer}`;
      const badge = document.getElementById("chat-peer-badge");
      if (!info) {
        badge.innerHTML = "";
        return;
      }
      badge.innerHTML = `<span class="pill ${info.verified ? "pill-ok" : "pill-warn"}">
        ${info.verified ? "VERIFICADO" : "NO VERIFICADO"}
      </span>`;
    }

    function renderMessages(history) {
      const box = document.getElementById("messages-box");
      const wasAtBottom = box.scrollHeight - box.scrollTop <= box.clientHeight + 40;
      if (!history.length) {
        box.innerHTML = `<div class="empty-hint">No hay mensajes aún con @${selectedPeer}.</div>`;
        return;
      }
      box.innerHTML = history.map(m => `
        <div class="msg ${m.dir}">
          <div>${escapeHtml(m.text)}</div>
          <div class="msg-meta">${m.ts}</div>
        </div>
      `).join("");
      if (wasAtBottom) box.scrollTop = box.scrollHeight;
    }

    async function sendMessage(e) {
      e.preventDefault();
      if (!selectedPeer) return;
      const input = document.getElementById("msg-input");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      try {
        await api("/api/messages", {
          method: "POST",
          body: JSON.stringify({ recipient: selectedPeer, text })
        });
        await refreshState();
      } catch (err) {
        alert(err.message);
      }
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }
  </script>
</body>
</html>
